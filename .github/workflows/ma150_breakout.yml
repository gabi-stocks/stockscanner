name: סריקה כללית למניות שפרצו שהגדרתי

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "sp500 / nasdaq100 / nasdaq / all"
        default: "all"
      asof:
        description: "תאריך (YYYY-MM-DD), ריק = סשן אחרון"
        default: ""
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = אחרי סגירת וול-סטריט, ימים ב'-ו'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests lxml
      - name: Run scanner
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          ARGS="--universe ${{ github.event.inputs.universe || 'all' }}"
          if [ -n "${{ github.event.inputs.asof }}" ]; then ARGS="$ARGS --asof ${{ github.event.inputs.asof }}"; fi
          python ma150_breakout_scanner.py $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: ma150-results
          path: results/
